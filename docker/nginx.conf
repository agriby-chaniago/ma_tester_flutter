server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # Dynamic .env — inject correct API_BASE for any workstation, any protocol
    location = /assets/.env {
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
        return 200 "API_BASE=$scheme://$http_host/api\nTIMEOUT_MS=90000\n";
    }

    # Proxy API → backend (strips /api/ prefix; FastAPI routes have no /api prefix)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    # Flutter SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
