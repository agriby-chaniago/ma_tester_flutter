name: ma_tester_flutter
description: Starter Flutter for black-box testing FastAPI (ngrok) segmentation model
publish_to: "none"
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  image_picker: ^1.0.7
  flutter_dotenv: ^6.0.0
  path_provider: ^2.1.3
  file_picker: ^10.3.3
  fl_chart: ^0.69.0
  device_info_plus: ^11.1.1
  connectivity_plus: ^6.1.3
  crypto: ^3.0.5
  mime: ^1.0.5
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
